<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description }}">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-css-reset@1.4.0/dist/reset.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #24292e;
      background-color: #ffffff;
    }
    h1, h2, h3, h4 {
      font-weight: 600;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      line-height: 1.25;
    }
    a {
      color: #0366d6;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    hr {
      border: none;
      border-top: 1px solid #e1e4e8;
      margin: 2rem 0;
    }
    header{
     margin-bottom: 4rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #e1e4e8;
    }
    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #586069;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #e1e4e8;
    }
  </style>
</head>
<body>

<header>
  <h1>{{ site.title }}</h1>
  

</header> 

<main>
  {{ content }}
</main>

<footer>
Designed by <a href="{{ site.author.url }}">{{ site.author.name }}</a>.
</footer>

</body>
</html>
